# Builds the patched bridge for this cluster. Lives on lhns-build rather than on the
# feature branch, so dm-room-name-template stays a clean rebase onto each upstream tag.
name: Image
on:
  push:
    branches: [lhns-build]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The connector links against libolm, so tests do not build without it.
      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev libolm3
      - name: Test
        run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lhns/mautrix-whatsapp:${{ github.sha }}
